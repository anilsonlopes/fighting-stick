[workspace]
members = ["crates/core", "crates/input", "crates/midi", "apps/desktop"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
eframe = "0.31"
midir = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }
thiserror = "2"
