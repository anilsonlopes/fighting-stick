name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup default stable-msvc
          rustc --version
          cargo --version
          cmake --version

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build application
        run: cargo build --release --locked -p fighting-stick-desktop

      - name: Package application
        shell: pwsh
        run: |
          $package = "FightingStickMidi-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Path "dist/$package" -Force | Out-Null
          Copy-Item "target/release/fighting-stick-desktop.exe" "dist/$package/FightingStickMidi.exe"
          Compress-Archive -Path "dist/$package/FightingStickMidi.exe" -DestinationPath "dist/$package.zip"
          $hash = (Get-FileHash "dist/$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content "dist/$package.zip.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/FightingStickMidi-${{ github.ref_name }}-windows-x64.zip" `
            "dist/FightingStickMidi-${{ github.ref_name }}-windows-x64.zip.sha256" `
            --verify-tag `
            --generate-notes `
            --title "Fighting Stick MIDI ${{ github.ref_name }}"
