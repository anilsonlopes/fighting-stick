name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup default stable-msvc
          rustc --version
          cargo --version
          cmake --version

      - name: Check release version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível ler a versão do Cargo." }
          $version = ($metadata.packages | Where-Object name -eq 'fighting-stick-desktop').version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME não corresponde à versão $version do aplicativo."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version"

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build application
        run: cargo build --release --locked -p fighting-stick-desktop

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 6 não foi encontrado no runner.' }
          & $iscc "/DAppVersion=$env:APP_VERSION" "installer/fighting-stick.iss"
          if ($LASTEXITCODE -ne 0) { throw "A compilação do instalador falhou ($LASTEXITCODE)." }

      - name: Check installer
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "dist/FightingStickMidi-Setup-$env:APP_VERSION.exe"
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Fighting Stick MIDI'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Fighting Stick MIDI\Fighting Stick MIDI.lnk'
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Fighting Stick MIDI.lnk'
          $install = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "A instalação falhou ($($install.ExitCode))." }
          if (-not (Test-Path (Join-Path $installDir 'FightingStickMidi.exe'))) { throw 'Aplicativo não foi instalado.' }
          if (-not (Test-Path $shortcut)) { throw 'Atalho do menu Iniciar não foi criado.' }
          if (-not (Test-Path $desktopShortcut)) { throw 'Atalho padrão da área de trabalho não foi criado.' }
          $uninstall = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "A desinstalação falhou ($($uninstall.ExitCode))." }
          if (Test-Path $desktopShortcut) { throw 'Atalho da área de trabalho permaneceu após desinstalar.' }
          $install = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/MERGETASKS=!desktopicon' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "A instalação sem atalho opcional falhou ($($install.ExitCode))." }
          if (-not (Test-Path $shortcut)) { throw 'Atalho do menu Iniciar não foi criado na segunda instalação.' }
          if (Test-Path $desktopShortcut) { throw 'Atalho opcional foi criado mesmo desmarcado.' }
          $uninstall = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "A segunda desinstalação falhou ($($uninstall.ExitCode))." }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/FightingStickMidi-Setup-$env:APP_VERSION.exe#Instalador Fighting Stick MIDI para Windows x64" `
            --verify-tag `
            --generate-notes `
            --title "Fighting Stick MIDI ${{ github.ref_name }}"
