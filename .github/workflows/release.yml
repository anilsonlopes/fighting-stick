name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup default stable-msvc
          rustc --version
          cargo --version
          cmake --version

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build application
        run: cargo build --release --locked -p fighting-stick-desktop

      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Copy-Item "target/release/fighting-stick-desktop.exe" "dist/FightingStickMidi.exe"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/FightingStickMidi.exe#Fighting Stick MIDI para Windows x64" `
            --verify-tag `
            --generate-notes `
            --title "Fighting Stick MIDI ${{ github.ref_name }}"
